<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plain Days Clock</title>

    <link
        rel="stylesheet"
        href="style.css?v=1"
    >
</head>

<body>

    <main class="clock-widget">

        <header class="clock-header">
            <span>Plain Days</span>
            <span class="live-dot"></span>
        </header>

        <section class="time-area">
            <strong id="time">00:00</strong>
            <span id="seconds">00</span>
        </section>

        <p id="date">
            Thursday, 30 July
        </p>

    </main>

    <script src="script.js?v=1"></script>

</body>

</html>
