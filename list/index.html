<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Plain Days Little List</title>
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="widget" aria-label="Plain Days Little List">
    <header class="header">
      <div>
        <strong>Plain Days</strong>
        <span>Little list</span>
      </div>
      <button class="text-button" id="editButton" type="button">Edit</button>
    </header>

    <section class="list" id="list" aria-live="polite"></section>

    <footer class="footer">
      <button class="add-button" id="addButton" type="button">＋ Add something</button>
      <span id="progress">0 / 0</span>
    </footer>
  </main>

  <template id="itemTemplate">
    <article class="item">
      <button class="check" type="button" aria-label="Mark complete">○</button>
      <input class="item-text" type="text" maxlength="90" aria-label="List item">
      <div class="item-actions">
        <button class="move move-up" type="button" aria-label="Move up">↑</button>
        <button class="move move-down" type="button" aria-label="Move down">↓</button>
        <button class="remove" type="button" aria-label="Delete">×</button>
      </div>
    </article>
  </template>

  <script src="script.js?v=2"></script>
</body>
</html>
