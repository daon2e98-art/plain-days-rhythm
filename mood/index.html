<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plain Days Mood</title>

    <link
        rel="stylesheet"
        href="style.css?v=6"
    >
</head>

<body>

    <main class="mood-widget">

        <!-- 상단 -->

        <header class="mood-header">
            <span>Plain Days</span>

            <div class="header-actions">
                <button
                    id="soundToggle"
                    type="button"
                    title="Sound on/off"
                >
                    ♪
                </button>

                <span id="currentDate">
                    30 / 07
                </span>
            </div>
        </header>


        <!-- 화면 전환 -->

        <nav class="view-tabs">

            <button
                class="view-tab active"
                data-view="today"
                type="button"
            >
                Today
            </button>

            <button
                class="view-tab"
                data-view="week"
                type="button"
            >
                Week
            </button>

            <button
                class="view-tab"
                data-view="month"
                type="button"
            >
                Month
            </button>

        </nav>


        <!-- 오늘의 기분 -->

        <section
            class="view today-view"
            id="todayView"
        >

            <div
                class="mood-stage"
                id="moodStage"
            >
                <div
                    class="main-face"
                    id="mainFace"
                >
                    ⁽·—·⁾
                </div>

                <span
                    class="mood-effect"
                    id="moodEffect"
                ></span>

                <p id="moodLabel">
                    How are you today?
                </p>
            </div>


            <div class="mood-options">

                <button
                    class="mood-option"
                    data-mood="happy"
                    type="button"
                    title="Happy"
                >
                    <span class="mini-face">⁽˙ᵕ˙⁾</span>
                    <span class="mood-dot">○</span>
                </button>

                <button
                    class="mood-option"
                    data-mood="calm"
                    type="button"
                    title="Calm"
                >
                    <span class="mini-face">˘ᵕ˘</span>
                    <span class="mood-dot">○</span>
                </button>

                <button
                    class="mood-option"
                    data-mood="tired"
                    type="button"
                    title="Tired"
                >
                    <span class="mini-face">－_－</span>
                    <span class="mood-dot">○</span>
                </button>

                <button
                    class="mood-option"
                    data-mood="sad"
                    type="button"
                    title="Sad"
                >
                    <span class="mini-face">•́︿•̀</span>
                    <span class="mood-dot">○</span>
                </button>

                <button
                    class="mood-option"
                    data-mood="angry"
                    type="button"
                    title="Angry"
                >
                    <span class="mini-face">•̀⤙•́</span>
                    <span class="mood-dot">○</span>
                </button>

            </div>

        </section>


        <!-- 주간 기록 -->

        <section
            class="view history-view"
            id="weekView"
            hidden
        >

            <header class="period-header">

                <button
                    id="previousWeek"
                    type="button"
                    aria-label="Previous week"
                >
                    ‹
                </button>

                <strong id="weekTitle"></strong>

                <button
                    id="nextWeek"
                    type="button"
                    aria-label="Next week"
                >
                    ›
                </button>

            </header>

            <div
                class="week-grid"
                id="weekGrid"
            ></div>

        </section>


        <!-- 월간 기록 -->

        <section
            class="view history-view"
            id="monthView"
            hidden
        >

            <header class="period-header">

                <button
                    id="previousMonth"
                    type="button"
                    aria-label="Previous month"
                >
                    ‹
                </button>

                <strong id="monthTitle"></strong>

                <button
                    id="nextMonth"
                    type="button"
                    aria-label="Next month"
                >
                    ›
                </button>

            </header>


            <div class="month-weekdays">
                <span>M</span>
                <span>T</span>
                <span>W</span>
                <span>T</span>
                <span>F</span>
                <span>S</span>
                <span>S</span>
            </div>


            <div
                class="month-grid"
                id="monthGrid"
            ></div>

        </section>

    </main>


    <script src="script.js?v=6"></script>

</body>

</html>
