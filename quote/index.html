<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Plain Days Quote</title>

    <link
        rel="stylesheet"
        href="style.css?v=1"
    >
</head>

<body>

    <main class="quote-widget">

        <header class="quote-header">
            <span>Plain Days</span>
            <span>A quiet reminder</span>
        </header>

        <section class="quote-area">
            <p id="quote">
                Small steps still move you forward.
            </p>
        </section>

        <footer class="quote-footer">
            <span id="date">30 / 07</span>
            <span class="symbol">○</span>
        </footer>

    </main>

    <script src="script.js?v=1"></script>

</body>

</html>
